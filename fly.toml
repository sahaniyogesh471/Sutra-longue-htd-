# Fly.io config for Sutra Lounge.
# Deploy:  fly launch --no-deploy --copy-config  &&  fly deploy
# Volume:  fly volumes create sutra_data --size 1 --region sin

app = "sutra-lounge"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4173"
  SUTRA_DB_PATH = "/app/data/sutra.db"
  SESSION_SECURE = "true"
  ADMIN_USERNAME = "admin"

# Persistent storage for the SQLite DB and uploaded images.
[mounts]
  source = "sutra_data"
  destination = "/app/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    # Fly terminates TLS; the app trusts the proxy via NODE_ENV=production.

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
