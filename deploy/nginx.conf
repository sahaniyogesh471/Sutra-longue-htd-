# /etc/nginx/sites-available/sutra-lounge
# Replace example.com with your real domain, then:
#   sudo ln -s /etc/nginx/sites-available/sutra-lounge /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot rewrites this file to add the TLS listeners and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 10M;

    # Real client IP + protocol so Express (trust proxy) builds correct URLs.
    location / {
        proxy_pass         http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
